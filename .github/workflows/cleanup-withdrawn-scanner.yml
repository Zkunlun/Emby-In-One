name: Clean withdrawn scanner release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-withdrawn-scanner.yml']
permissions:
  contents: write
concurrency:
  group: cleanup-withdrawn-scanner
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'Zkunlun/Emby-In-One'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets = [
              ['tags/V1.5.0', 'b356bf5a9c6bea3dc694557405bf15bc58ca5aa5'],
              ['heads/release/V1.5.0', 'b356bf5a9c6bea3dc694557405bf15bc58ca5aa5'],
              ['heads/dev/full-library-scan-phase1a-sampling', 'cacd226767cbe991aede47bb3926b4b9b1b31738'],
              ['heads/dev/full-library-scan-phase3-shared-foundation', '8c0c933779c8a8d2cadda7f5843e7ab1051cf5b0']
            ];
            const existing = [];
            for (const [ref, expected] of targets) {
              try {
                const {data} = await github.rest.git.getRef({...context.repo, ref});
                if (data.object.sha !== expected) throw new Error('Ref changed: ' + ref);
                existing.push(ref);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info('Already absent: ' + ref);
              }
            }
            for (const ref of existing) {
              await github.rest.git.deleteRef({...context.repo, ref});
              core.info('Deleted: ' + ref);
            }
            for (const [ref] of targets) {
              try {
                await github.rest.git.getRef({...context.repo, ref});
                throw new Error('Ref still exists: ' + ref);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await core.summary.addHeading('Withdrawn scanner release cleanup').addList(targets.map(([ref]) => 'Absent: ' + ref)).write();
